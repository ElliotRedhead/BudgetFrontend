name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: e2e-only-secret-key-long-enough-for-signing
      DJANGO_DEBUG: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check out the backend
        uses: actions/checkout@v7
        with:
          repository: ElliotRedhead/BudgetBackend
          path: backend
      - name: Install uv
        uses: astral-sh/setup-uv@v10
      - name: Start the backend
        working-directory: backend
        run: |
          uv sync --locked
          uv run python manage.py migrate
          uv run python manage.py runserver 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://localhost:8000/schema/ > /dev/null && break; sleep 1; done
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run e2e
      - name: Show the backend log
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"
